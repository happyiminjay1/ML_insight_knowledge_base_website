name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HTML_ROOT: html
  SITE_TITLE: HTML Library

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
          if [ -d "$HTML_ROOT" ]; then cp -r "$HTML_ROOT" "_site/$HTML_ROOT"; fi
          if [ -d assets ]; then cp -r assets _site/assets; fi
          python scripts/build_manifest.py --root "$HTML_ROOT" --out _site/manifest.json --title "$SITE_TITLE"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
