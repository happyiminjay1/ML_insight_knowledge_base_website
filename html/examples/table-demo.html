<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table demo</title>
<style>
  body { margin: 0; padding: 40px 24px; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: #1b1f24; background: #fff; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e1e4e9; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #5c6673; }
  td.num { text-align: right; }
  p { color: #5c6673; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Table demo</h1>
  <p>An example file in a sub-folder (<code>html/examples/</code>) — sub-folders become groups in the sidebar.</p>
  <table>
    <thead><tr><th>Model</th><th>Params</th><th>Context</th><th>Release</th></tr></thead>
    <tbody>
      <tr><td>example-small</td><td class="num">1.3 B</td><td class="num">8 k</td><td>2025-11</td></tr>
      <tr><td>example-base</td><td class="num">7 B</td><td class="num">32 k</td><td>2026-02</td></tr>
      <tr><td>example-large</td><td class="num">34 B</td><td class="num">128 k</td><td>2026-06</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
